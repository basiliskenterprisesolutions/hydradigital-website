    <!-- Fonts are self-hosted and declared inline. They were previously a
         <link> to fonts.googleapis.com, which was render-blocking on a second
         origin: the browser had to resolve DNS, do a TLS handshake and fetch a
         stylesheet before it knew the woff2 URLs, which live on a *third*
         origin needing its own handshake. Lighthouse measured that one link at
         865 ms of render-blocking time, and removing it moved the mobile
         performance score from 65 to 80 on its own.
         Declaring @font-face here instead costs no request at all. Whatever
         the typefaces are, they stay self-hosted - do not reintroduce that link.

         Three families, each with one job. Syne is the display face: the brand
         wordmark, both hero h1s, every section h2 and card h3. Space Mono is the
         label face: nav, eyebrows, buttons, card numbers, form labels,
         breadcrumbs and the footer cluster. Poppins is the reading face, applied
         through --font-body, which body inherits and every paragraph with it.

         Syne is variable so one file covers 400-800. Space Mono and Poppins are
         static and need a file per weight. Only the Poppins weights the body
         copy actually renders are shipped, which is 400 and 600 - measured
         across all seven routes plus the 404, not guessed. The 300, 500 and 700
         files Google offers were dropped: nothing that lands on --font-body asks
         for them, so they would be bytes nobody ever downloads. 700 was needed
         only while the service-page headings were wrongly inheriting the body
         face; they name --font-heading now, so it went with them. If a paragraph
         rule ever starts using another weight, add the face here or the browser
         will synthesise it.

         Only latin and latin-ext are shipped. Google also offers devanagari for
         Poppins, dropped for the same reason the Syne greek and vietnamese
         subsets were: offered, and on an English site never matched.

         Filenames carry the upstream font version (syne-v24, space-mono-v17,
         poppins-v24), which is what lets public/.htaccess and public/_headers
         mark /fonts/ immutable - a given URL can never change meaning. Bump the
         version in the filename if any of these are regenerated.

         Syne and Poppins 400 are both preloaded because @font-face alone is not
         a fetch: a file is not requested until the stylesheet has parsed and
         layout has found text needing it. Both are above the fold - Syne for the
         hero headline, Poppins for the paragraph directly under it - and Poppins
         400 is only 7.7 KB, so the second preload costs little and removes a
         visible reflow on all the body copy. Space Mono stays unpreloaded, as it
         always was: small supporting text only. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/syne-v24-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-v24-latin-400.woff2" crossorigin />

    <!-- The favicon was previously an SVG of a white dragon on transparency, so it
         rendered as nothing against Google's white results page and on light
         browser tab bars. It now sits on a dark rounded square. /favicon.ico is
         listed explicitly and also exists at the conventional root path, because
         Google falls back to /favicon.ico and it was returning 404. Google wants
         a square whose side is a multiple of 48px, hence the 48/96/192 set. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
